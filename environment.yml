# Conda-Umgebung für das lokale Kite-Windmodell (Zingst / Darß / Bodden)
#   conda env create -f environment.yml
#   conda activate kitewind
name: kitewind
channels:
  - conda-forge
dependencies:
  - python=3.12
  # Daten
  - numpy>=1.26
  - pandas>=2.2
  - pyarrow>=15          # schnelles Speichern als Parquet
  - xarray>=2024.2
  - cfgrib>=0.9.11       # DWD-ICON-GRIB-Dateien direkt lesen (Live-Vorhersage)
  - eccodes>=2.34
  - netcdf4>=1.6         # Satellitendaten (NetCDF)
  - copernicusmarine>=2.0  # Sentinel-1-Wind von Copernicus Marine
  # Flachwasserkarte (training/depth_map.py): Sentinel-2 von AWS Earth Search
  - odc-stac>=0.3.9
  - pystac-client>=0.7
  - rasterio>=1.3
  - dask
  - shapely>=2.0        # Tiefenebene der App (training/depth_layer.py)
  - scipy
  # Modell und Auswertung
  - scikit-learn>=1.4
  - xgboost
  - certifi>=2.0
  - shap>=0.45
  - optuna>=3.6          # Hyperparameter-Suche
  # Grafiken und Notebooks
  - matplotlib>=3.8
  - seaborn>=0.13
  - jupyterlab>=4.1
  - ipywidgets>=8.1
  # Hilfen
  - requests>=2.31
  - tqdm>=4.66
  - pip
  - pip:
    - global-land-mask   # Land/Wasser-Maske für ostsee_waves.py
