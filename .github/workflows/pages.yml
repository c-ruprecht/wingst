# Veröffentlicht den Ordner app/ als GitHub Pages (https://c-ruprecht.github.io/wingst/)
# Zwei Jobs (bauen, dann veröffentlichen) wie in der GitHub-Vorlage: vermeidet den Fehler
# „No artifacts named github-pages were found“, wenn das Paket im selben Job noch nicht sichtbar ist.
name: App veröffentlichen
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
